name: Generate Insurance Calculator

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate calculator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_calculator.py
      - name: Commit and push
        run: |
          git config user.name "Calccover Bot"
          git config user.email "bot@calccover.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Auto-generate calculator $(date -u +%Y-%m-%d)"
            git push
          fi
