name: Add property calculator internal links

on:
  workflow_dispatch:   # manual trigger only — you click Run workflow

permissions:
  contents: write      # needed to commit and push

jobs:
  add-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run link insertion script
        run: python scripts/add_property_calculator_links.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit — script was a no-op."
          else
            git add -A
            git commit -m "Upgrade internal links to commercial property insurance calculator (50 state pages + homepage)"
            git push
          fi
