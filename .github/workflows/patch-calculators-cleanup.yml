name: Cleanup calculator patches (one-time)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run cleanup
        run: python scripts/patch_calculators_cleanup.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Cleanup: remove bylines from legal pages, fix calculator footers" || echo "No changes"
          git push
