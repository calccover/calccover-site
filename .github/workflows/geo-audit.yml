name: GEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 2 PM Bangkok

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4
      - name: Run GEO audit
        env:
          SITE_URL: https://calccover.com
        run: python scripts/geo_audit.py
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: geo-report
          path: geo_report.json
