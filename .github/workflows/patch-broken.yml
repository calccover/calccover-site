name: Patch Broken Pages (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch pages
        run: python scripts/patch_broken_pages.py
      - name: Commit and push
        run: |
          git config user.name "Calccover Bot"
          git config user.email "bot@calccover.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Fix broken JS and content-section wrappers"
            git push
          fi
