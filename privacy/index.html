        <h1>Privacy Policy</h1>
        <p class="updated">Last updated: September 16, 2026</p>

        <p>This Privacy Policy describes how Calccover ("we," "us," or "our") collects, uses, and shares information when you visit <a href="https://calccover.com">calccover.com</a> (the "Site").</p>

        <h2>Information We Collect</h2>
        <p>We do not require you to create an account, and we do not collect personally identifiable information unless you voluntarily provide it (for example, by emailing us or submitting a quote request form).</p>
        <p>We automatically collect certain non-personal information when you visit the Site:</p>
        <ul>
            <li>Browser type and version</li>
            <li>Device type and operating system</li>
            <li>Pages viewed and time spent on the Site</li>
            <li>Referring URL and general geographic location (country or region)</li>
        </ul>

        <h2>Cookies and Tracking</h2>
        <p>We use cookies and similar technologies to analyze traffic and improve the Site. Third-party services we use may also set cookies:</p>
        <ul>
            <li><strong>Google Analytics</strong> — for traffic analysis</li>
            <li><strong>Google AdSense</strong> — for displaying advertisements</li>
        </ul>
        <p>Google, as a third-party vendor, uses cookies to serve ads on the Site. Google's use of advertising cookies enables it and its partners to serve ads based on your visit to our Site and other sites on the Internet. You may opt out of personalized advertising by visiting <a href="https://www.google.com/settings/ads" target="_blank" rel="noopener">Google Ads Settings</a>.</p>

        <h2>How We Use Information</h2>
        <p>We use the information we collect to:</p>
        <ul>
            <li>Operate and improve the Site</li>
            <li>Analyze usage patterns and trends</li>
            <li>Display relevant advertisements</li>
            <li>Respond to your inquiries</li>
        </ul>

        <h2>Quote Request Forms</h2>
        <p>If you submit a quote request through one of our calculators, your information is shared with licensed insurance partners who may contact you with quotes. We may receive compensation for these referrals. We do not sell your information to unrelated third parties.</p>

        <h2>Your Rights</h2>
        <p>You may request access to, correction of, or deletion of any personal information we hold about you by emailing <a href="mailto:hello@calccover.com">hello@calccover.com</a>.</p>

        <h2>Children's Privacy</h2>
        <p>The Site is not directed at children under 13, and we do not knowingly collect information from children under 13.</p>

        <h2>Changes to This Policy</h2>
        <p>We may update this Privacy Policy from time to time. Changes will be posted on this page with an updated date.</p>

        <h2>Contact</h2>
        <p>Questions about this policy? Email <a href="mailto:hello@calccover.com">hello@calccover.com</a>.</p>
